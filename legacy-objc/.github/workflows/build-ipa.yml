name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    # Xcode 16 / iOS 18 SDK. 최신 SDK로 빌드하면 UIScene 필수 정책에 걸릴 수 있어 일부러 한 세대 이전 SDK 사용
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Patch Info.plist (armv7 -> arm64)
        run: |
          /usr/libexec/PlistBuddy -c "Delete :UIRequiredDeviceCapabilities" Brokenithm-iOS/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities array" Brokenithm-iOS/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities:0 string arm64" Brokenithm-iOS/Info.plist

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Brokenithm-iOS.xcworkspace \
            -scheme Brokenithm-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Brokenithm-iOS-unsigned.ipa Payload
          ls -la Brokenithm-iOS-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Brokenithm-iOS-unsigned-ipa
          path: Brokenithm-iOS-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

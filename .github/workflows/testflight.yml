name: TestFlight

# Archives a signed build and uploads it to TestFlight.
# Runs on the 1st of every month, or on demand from the Actions tab.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   APP_STORE_CONNECT_KEY_ID          App Store Connect API key ID          (e.g. ABC123DEF4)
#   APP_STORE_CONNECT_ISSUER_ID       App Store Connect API issuer ID       (UUID)
#   APP_STORE_CONNECT_PRIVATE_KEY     Contents of the AuthKey_XXXX.p8 file  (PEM text)
#   DISTRIBUTION_CERTIFICATE_P12      Apple Distribution certificate + private key, base64-encoded .p12
#   DISTRIBUTION_CERTIFICATE_PASSWORD Password used when exporting the .p12
#
# Security notes for this public repo:
#   * Secrets are never available to workflows triggered from forks; this
#     workflow only runs on schedule or manual dispatch from this repo.
#   * Secrets are only ever referenced from `env:` blocks and are masked in
#     logs. Nothing here prints them, and no archive/IPA/log is uploaded as an
#     artifact.
#   * Signing material lives in a throwaway keychain that is deleted in an
#     `always()` step, even if the build fails.

on:
  schedule:
    - cron: '0 14 1 * *'   # 14:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      force:
        description: 'Upload even if there were no commits in the last month'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  SCHEME: brokenithm-swiftui
  PROJECT: brokenithm-swiftui.xcodeproj
  TEAM_ID: 63LV533T6V   # already public in project.pbxproj; not a secret

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    # Never run this job in forks (they have no secrets anyway, but fail fast).
    if: github.repository == 'OWCramer/Brokenithm-SwiftUI'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can read tags and commit dates

      - name: Decide whether a new build is needed
        id: gate
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          LAST_COMMIT="$(git log -1 --format=%ct HEAD)"
          CUTOFF="$(( $(date -u +%s) - 32*24*3600 ))"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${FORCE:-false}" == "true" ]]; then
            echo "Forced run."; echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual run."; echo "run=true" >> "$GITHUB_OUTPUT"
          elif (( LAST_COMMIT >= CUTOFF )); then
            echo "Commits found in the last month."; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits in the last 32 days; skipping TestFlight upload."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check secrets are configured
        if: steps.gate.outputs.run == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          P12: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEY_ID ISSUER_ID PRIVATE_KEY P12 P12_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Secret for $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Show Xcode version
        if: steps.gate.outputs.run == 'true'
        run: xcodebuild -version

      - name: Resolve version numbers
        if: steps.gate.outputs.run == 'true'
        id: version
        run: |
          set -euo pipefail
          # Marketing version: latest "vX.Y.Z" tag if one exists, else the project value.
          TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [[ -n "$TAG" ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION = ([^;]+);/\1/p' "$PROJECT/project.pbxproj" | head -1)"
          fi
          # Build number must strictly increase per version on TestFlight;
          # a UTC timestamp guarantees that without any stored state.
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          echo "version=$VERSION"    >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION ($BUILD_NUMBER)"

      - name: Install signing certificate and API key
        if: steps.gate.outputs.run == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          P12: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          SIGNING_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$SIGNING_DIR"

          # App Store Connect API key (used by xcodebuild for profiles + upload)
          AUTH_KEY_PATH="$SIGNING_DIR/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$PRIVATE_KEY" > "$AUTH_KEY_PATH"

          # Throwaway keychain with a random password
          KEYCHAIN_PATH="$SIGNING_DIR/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the Apple Distribution certificate
          CERT_PATH="$SIGNING_DIR/distribution.p12"
          printf '%s' "$P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # An "identity" is a certificate paired with its private key. If the .p12 was
          # exported without the private key, import succeeds but no identity exists and
          # every later signing step fails, so check here with a clear message.
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c "Apple Distribution" || true)"
          if [[ "$IDENTITIES" -eq 0 ]]; then
            echo "::error::The DISTRIBUTION_CERTIFICATE_P12 secret contains no Apple Distribution identity. The .p12 must include the private key: in Keychain Access, pick the 'My Certificates' category, expand the certificate, select both the certificate and its key, then Export. See .github/RELEASING.md."
            exit 1
          fi
          echo "Imported $IDENTITIES Apple Distribution identity"

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          {
            echo "AUTH_KEY_PATH=$AUTH_KEY_PATH"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

      - name: Archive
        if: steps.gate.outputs.run == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive | xcbeautify --renderer github-actions

      - name: Export and upload to App Store Connect
        if: steps.gate.outputs.run == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | xcbeautify --renderer github-actions
          echo "Uploaded ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }}) to App Store Connect. It appears in TestFlight after processing."

      - name: Clean up signing material
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/export" "$RUNNER_TEMP/$SCHEME.xcarchive" "$RUNNER_TEMP/ExportOptions.plist" 2>/dev/null || true
